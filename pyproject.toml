[project]
name = "fastapi-demo"
version = "0.1.0"
description = "A blog API + website built while learning FastAPI (async SQLAlchemy, JWT, Alembic)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.2",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]   # where `uv run pytest` looks for test files
pythonpath = ["."]      # so tests can `import main`, `import models`, ...
